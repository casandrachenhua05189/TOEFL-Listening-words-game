<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>托福听力800词 · 拼写大冒险</title>
<style>
:root{--ink:#1a1a1a;--sub:#666;--faint:#999;--line:#e5e5e2;--bg:#f6f6f4;--ok:#2e9e5b;--bad:#d64545;--gold:#b8860b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
#app{width:100%;max-width:600px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
h1{font-size:22px}
.sub{color:var(--sub);font-size:13px;margin:4px 0 20px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.mode{border:1.5px solid var(--line);border-radius:14px;padding:18px 14px;cursor:pointer;background:#fff;text-align:left;transition:border-color .15s}
.mode:hover{border-color:var(--ink)}
.mode.sel{border-color:var(--ink);background:#fafaf8}
.mode .t{font-size:16px;font-weight:700;margin-bottom:4px}
.mode .d{font-size:12px;color:var(--sub);line-height:1.5}
.mode.wide{grid-column:1/3;display:flex;justify-content:space-between;align-items:center}
.mode .count{font-size:13px;color:var(--gold);font-weight:700}
.opt-title{font-size:13px;color:var(--sub);margin:14px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;background:#fff;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:inline-block;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:12px 26px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:8px;flex-wrap:wrap;gap:6px}
.hud b{color:var(--ink)}
.hearts{font-size:14px;letter-spacing:2px}
.combo{font-size:13px;color:var(--gold);font-weight:700;min-height:18px;text-align:center;margin-bottom:4px}
.combo.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.progress{height:6px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress>div{height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.timerbar{height:6px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:20px}
.timerbar>div{height:100%;background:var(--ok);border-radius:99px;transition:width 1s linear}
.timerbar.low>div{background:var(--bad)}
.prompt{text-align:center;margin:22px 0 8px}
.prompt .mean{font-size:23px;font-weight:700;line-height:1.4}
.prompt .pos{font-size:14px;color:var(--sub);margin-top:6px}
.prompt .hint{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:3px;color:var(--faint);margin-top:14px;min-height:22px}
.speakrow{text-align:center;margin-bottom:14px}
.speak{border:none;background:none;font-size:13px;color:#555;text-decoration:underline;cursor:pointer;font-family:inherit}
input[type=text]{width:100%;padding:14px;font-size:19px;border:1.5px solid var(--line);border-radius:10px;text-align:center;letter-spacing:1px;margin-bottom:12px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--ink)}
input[type=text].ok{border-color:var(--ok);background:#f0faf3}
input[type=text].bad{border-color:var(--bad);background:#fdf1f1}
.feedback{min-height:24px;font-size:14px;text-align:center;margin-bottom:12px}
.feedback .ok{color:var(--ok)}
.feedback .bad{color:var(--bad)}
.row{display:flex;gap:8px}
.row .btn{flex:1;padding:11px 8px;font-size:14px}
.quizgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.qopt{border:1.5px solid var(--line);border-radius:10px;padding:14px 8px;font-size:15px;background:#fff;cursor:pointer;font-family:inherit}
.qopt:hover{border-color:var(--ink)}
.qopt.ok{border-color:var(--ok);background:#f0faf3;color:var(--ok);font-weight:700}
.qopt.bad{border-color:var(--bad);background:#fdf1f1;color:var(--bad)}
.result{text-align:center}
.score{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--sub)}
.statchips{display:flex;justify-content:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.statchip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--sub)}
.statchip b{color:var(--ink)}
.grade{color:var(--sub);margin:8px 0 20px;font-size:14px}
.wrong-title{text-align:left;font-size:13px;color:var(--sub);margin-bottom:10px}
.wrong-item{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:14.5px;gap:8px}
.wrong-item .w{font-weight:700;cursor:pointer;white-space:nowrap}
.wrong-item .c{color:var(--sub);font-size:12.5px;text-align:right}
.empty{color:var(--ok);text-align:center;padding:12px;font-size:14px}
.best{font-size:12px;color:var(--faint);margin-top:10px;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.bigbtns{margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
</style>
</head>

<div id="app">

<!-- 首页 -->
<div class="card" id="home">

  </div>
  <div class="opt-title">选择话题范围（闯关 / 快答模式生效）</div>
  <div class="chips" id="topicChips"></div>
  <div style="text-align:center;margin-top:22px">
    <button class="btn" id="startBtn" style="width:100%">开始游戏</button>
    <p class="best" id="bestLine"></p>
  </div>
</div>

<!-- 游戏页 -->
<div class="card" id="game" style="display:none">
  <div class="hud">
    <span id="hudLeft"></span>
    <span class="hearts" id="hudHearts"></span>
    <span id="hudRight"></span>
  </div>
  <div class="combo" id="combo"></div>
  <div class="progress" id="progWrap"><div id="prog" style="width:0%"></div></div>
  <div class="timerbar" id="timerWrap" style="display:none"><div id="timer" style="width:100%"></div></div>

  <div id="spellArea">
    <div class="prompt">
      <div class="mean" id="gMean"></div>
      <div class="pos" id="gPos"></div>
      <div class="hint" id="gHint"></div>
    </div>
    <div class="speakrow"><button class="speak" id="gSpeak">🔊 听发音</button></div>
    <input type="text" id="gInput" placeholder="输入英文，回车提交" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="feedback" id="gFb"></div>
    <div class="row">
      <button class="btn" id="gSubmit">提交</button>
      <button class="btn ghost" id="gHintBtn">提示首字母</button>
      <button class="btn ghost" id="gSkip">认识，跳过</button>
    </div>
  </div>

  <div id="quizArea" style="display:none">
    <div class="prompt">
      <div class="mean" id="qMean"></div>
      <div class="pos" id="qPos"></div>
    </div>
    <div class="speakrow"><button class="speak" id="qSpeak">🔊 听发音（送分提示）</button></div>
    <div class="quizgrid" id="qOpts"></div>
    <div class="feedback" id="qFb"></div>
  </div>
</div>

<!-- 结算页 -->
<div class="card result" id="result" style="display:none">
  <h1 id="rTitle" style="font-size:20px">本局结束</h1>
  <div class="score"><span id="rScore">0</span><small> 分</small></div>
  <div class="statchips" id="rStats"></div>
  <p class="grade" id="rGrade"></p>
  <div style="text-align:left;margin-bottom:6px">
    <div class="wrong-title">本局错词（点击听发音，已自动存入错词本）</div>
    <div id="rWrong"></div>
  </div>
  <div class="bigbtns">
    <button class="btn" id="rRetry">再来一局</button>
    <button class="btn ghost" id="rReview">练错词本</button>
    <button class="btn ghost" id="rHome">返回首页</button>
  </div>
</div>

</div>

function el(id){return document.getElementById(id)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z']/g,"")}

function loadWrong(){try{return JSON.parse(localStorage.getItem("tb8_wrong")||"{}")}catch(e){return{}}}
function saveWrong(w){localStorage.setItem("tb8_wrong",JSON.stringify(w))}
function addWrong(item){var w=loadWrong();w[item[0]]={ph:item[1],m:item[2],t:item[3],ts:Date.now()};saveWrong(w);refreshWrongCount()}

function refreshWrongCount(){var n=Object.keys(loadWrong()).length;el("wrongCount").textContent=n+" 词待复习"}
function getBest(k){return parseInt(localStorage.getItem(k)||"0")}
function setBest(k,v){if(v>getBest(k))localStorage.setItem(k,v)}

      selectedTopics[t]=e.target.classList.contains("on");
      var allOn=true;wrap.querySelectorAll(".chip").forEach(function(c){if(c.dataset.t!=="__all"&&!c.classList.contains("on"))allOn=false});
      all.classList.toggle("on",allOn);
    }
  };
})();
document.querySelectorAll(".mode").forEach(function(m){
  m.onclick=function(){
    document.querySelectorAll(".mode").forEach(function(x){x.classList.remove("sel")});
    m.classList.add("sel");selectedMode=m.dataset.mode;
  };
});
el("startBtn").onclick=function(){
  if(selectedMode==="review"){
    var w=loadWrong();var keys=Object.keys(w);
    if(!keys.length){alert("错词本是空的，先去闯几关吧！");return}
    var pool=keys.map(function(k){return [k,w[k].ph,w[k].m,w[k].t]});
    startSpell(pool,true);
  }else{
    var pool=DATA.filter(function(d){return selectedTopics[d[3]]!==false});
    if(!pool.length)pool=DATA.slice();
    if(selectedMode==="spell")startSpell(shuffle(pool.slice()),false);
    else startQuiz(shuffle(pool.slice()));
  }
};

/* ---------- 闯关（拼写） ---------- */
var S={};
function startSpell(pool,isReview){
  S={pool:pool,i:0,score:0,streak:0,hearts:3,answered:0,correct:0,wrong:[],locked:false,review:isReview,hintUsed:false};
  el("home").style.display="none";el("result").style.display="none";el("game").style.display="block";
  el("quizArea").style.display="none";el("spellArea").style.display="block";
  el("timerWrap").style.display="none";el("progWrap").style.display="block";
  el("gHintBtn").style.display=isReview?"none":"inline-block";
  el("gSkip").textContent=isReview?"暂时跳过":"认识，跳过";
  renderSpell();
}
function renderSpell(){
  S.locked=false;S.hintUsed=false;
  var d=S.pool[S.i];
  el("hudLeft").innerHTML="第 <b>"+(S.i+1)+"</b> / "+S.pool.length+" 题";
  el("hudRight").innerHTML="得分 <b>"+S.score+"</b>";
  el("hudHearts").textContent=S.review?"复习模式":"♥".repeat(S.hearts)+"♡".repeat(Math.max(0,3-S.hearts));
  el("prog").style.width=(S.i/S.pool.length*100)+"%";
  el("combo").textContent=S.streak>=2?"连击 ×"+S.streak+"　(+"+Math.round(10*(1+S.streak*0.15))+" 分/题)":"";
  el("gMean").textContent=d[2];
  el("gPos").textContent=d[1]+"　·　"+d[3];
  el("gHint").textContent=d[0].replace(/[A-Za-z]/g,"_").split("").join(" ");
  el("gFb").innerHTML="";
  var inp=el("gInput");inp.value="";inp.className="";inp.disabled=false;inp.focus();
}
function spellAnswer(skipped){
  if(S.locked)return;S.locked=true;
  var d=S.pool[S.i],inp=el("gInput"),val=norm(inp.value),target=norm(d[0]);
  inp.disabled=true;
  if(!skipped&&val===target){
    S.streak++;var pts=Math.round(10*(1+(S.streak-1)*0.15))-(S.hintUsed?2:0);pts=Math.max(1,pts);
    S.score+=pts;S.correct++;S.answered++;
    inp.className="ok";el("gFb").innerHTML='<span class="ok">正确！+'+pts+' 分</span>';
    if(S.review)removeWrong(d[0]);
    var cb=el("combo");cb.classList.remove("pop");void cb.offsetWidth;cb.classList.add("pop");
    setTimeout(nextSpell,850);
  }else{
    S.streak=0;S.answered++;if(!S.review)S.hearts--;
    S.wrong.push(d);addWrong(d);
    inp.className="bad";inp.value=d[0];
    el("gFb").innerHTML='<span class="bad">'+(skipped?"没关系，答案是：":"拼写有误，正确：")+'<b>'+d[0]+'</b></span>';
    el("gInput").classList.add("shake");
    el("hudHearts").textContent=S.review?"复习模式":"♥".repeat(Math.max(0,S.hearts))+"♡".repeat(3-Math.max(0,S.hearts));
    if(!S.review&&S.hearts<=0){setTimeout(function(){showResult(false)},1600);return}
    setTimeout(nextSpell,1700);
  }
}
function nextSpell(){
  S.i++;
  if(S.i>=S.pool.length){showResult(true);return}
  renderSpell();
}
el("gSubmit").onclick=function(){spellAnswer(false)};
el("gInput").addEventListener("keydown",function(e){if(e.key==="Enter")spellAnswer(false)});
el("gSkip").onclick=function(){if(S.locked)return;S.locked=true;var d=S.pool[S.i];S.answered++;S.streak=0;
  el("gFb").innerHTML='<span style="color:#999">已跳过：'+d[0]+'（'+d[2]+'）</span>';speak(d[0]);
  setTimeout(nextSpell,1100)};
el("gHintBtn").onclick=function(){if(S.locked||S.hintUsed)return;S.hintUsed=true;
  var d=S.pool[S.i];
  el("gHint").textContent=d[0].split("").map(function(ch,i){return /[A-Za-z]/.test(ch)?(i===0||d[0][i-1]===" "||d[0][i-1]==="-"||d[0][i-1]==="/"?ch:"_"):ch}).join(" ");
  el("gHintBtn").textContent="已用提示 (-2分)";el("gHintBtn").disabled=true;
  setTimeout(function(){el("gHintBtn").textContent="提示首字母"},1500)};
el("gSpeak").onclick=function(){speak(S.pool[S.i][0])};

/* ---------- 限时快答（四选一） ---------- */
var Q={};
function startQuiz(pool){
  Q={pool:pool,i:0,score:0,time:60,answered:0,correct:0,wrong:[],locked:false,timer:null};
  el("home").style.display="none";el("result").style.display="none";el("game").style.display="block";
  el("spellArea").style.display="none";el("quizArea").style.display="block";
  el("timerWrap").style.display="block";el("progWrap").style.display="none";
  Q.timer=setInterval(function(){
    Q.time--;el("timer").style.width=(Q.time/60*100)+"%";
    el("timerWrap").classList.toggle("low",Q.time<=10);
    el("hudRight").innerHTML="剩余 <b>"+Q.time+"</b> 秒";
    if(Q.time<=0){clearInterval(Q.timer);showResultQuiz()}
  },1000);
  renderQuiz();
}
function renderQuiz(){
  Q.locked=false;
  var d=Q.pool[Q.i%Q.pool.length];
  el("hudLeft").innerHTML="已答 <b>"+Q.answered+"</b> 题";
  el("hudRight").innerHTML="剩余 <b>"+Q.time+"</b> 秒 · 得分 <b>"+Q.score+"</b>";
  el("qMean").textContent=d[2];
  el("qPos").textContent=d[3]+" · 选出正确的英文";
  el("qFb").innerHTML="";
  // 干扰项：优先同话题
  var distract=shuffle(Q.pool.filter(function(x){return x[0]!==d[0]&&(x[3]===d[3]||Math.random()<0.25)})).slice(0,3);
  var extra=shuffle(Q.pool.filter(function(x){return x[0]!==d[0]&&distract.indexOf(x)<0}));
  while(distract.length<3&&extra.length)distract.push(extra.pop());
  var opts=shuffle([d].concat(distract));
  var wrap=el("qOpts");wrap.innerHTML="";
  opts.forEach(function(o){
    var b=document.createElement("button");b.className="qopt";b.textContent=o[0];
    b.onclick=function(){quizAnswer(b,o,d)};wrap.appendChild(b);
  });
  Q.cur=d;
}
function quizAnswer(btn,o,d){
  if(Q.locked)return;Q.locked=true;Q.answered++;
  var btns=el("qOpts").children;
  if(o[0]===d[0]){
    btn.className="qopt ok";Q.correct++;Q.score+=10;Q.time+=1;
    el("qFb").innerHTML='<span class="ok">正确！+10 分，+1 秒</span>';
  }else{
    btn.className="qopt bad";Q.score=Math.max(0,Q.score-5);Q.time-=3;
    Q.wrong.push(d);addWrong(d);
    for(var i=0;i<btns.length;i++)if(btns[i].textContent===d[0])btns[i].className="qopt ok";
    el("qFb").innerHTML='<span class="bad">正确答案：<b>'+d[0]+'</b>（-3 秒）</span>';
  }
  el("hudRight").innerHTML="剩余 <b>"+Q.time+"</b> 秒 · 得分 <b>"+Q.score+"</b>";
  Q.i++;
  setTimeout(function(){
    if(Q.time<=0){clearInterval(Q.timer);showResultQuiz();return}
    renderQuiz();
  },900);
}
el("qSpeak").onclick=function(){speak(Q.cur[0])};

/* ---------- 结算 ---------- */
function gradeOf(pct,mode){
  if(pct>=0.9)return mode==="quiz"?"反应如闪电，词库已被你攻陷！":"接近满分，这 800 词对你已是囊中之物！";
  if(pct>=0.75)return"很强！错词再复习一轮就能封顶。";
  if(pct>=0.5)return"不错，稳扎稳打，错词本见。";
  if(pct>=0.3)return"渐入佳境，建议缩小话题范围专项突破。";
  return"万事开头难，先从错词本里的 10 个词开始吧！";
}
function fillWrongList(wrongArr){
  var wrap=el("rWrong");
  if(!wrongArr.length){wrap.innerHTML='<div class="empty">零失误，完美通关</div>';return}
  wrap.innerHTML=wrongArr.map(function(d){
    return '<div class="wrong-item"><span class="w" data-w="'+d[0]+'">'+d[0]+'</span><span class="c">'+d[1]+'<br>'+d[2]+'</span></div>';
  }).join("");
  wrap.querySelectorAll(".w").forEach(function(x){x.onclick=function(){speak(this.dataset.w)}});
}
function showResult(cleared){
  clearInterval(Q.timer||null);
  el("game").style.display="none";el("result").style.display="block";
  el("rTitle").textContent=S.review?"复习完成":"闯关"+(cleared?"通关":"结束");
  el("rScore").textContent=S.score;
  var pct=S.answered?S.correct/S.answered:0;
  el("rStats").innerHTML=
    '<span class="statchip">答题 <b>'+S.answered+'</b></span>'+
    '<span class="statchip">正确率 <b>'+Math.round(pct*100)+'%</b></span>'+
    '<span class="statchip">最高连击 <b>×'+S.bestStreak+'</b></span>';
  el("rGrade").textContent=gradeOf(pct,"spell");
  fillWrongList(S.wrong);
  setBest("tb8_best_spell",S.score);refreshBest();
}
function showResultQuiz(){
  clearInterval(Q.timer);
  el("game").style.display="none";el("result").style.display="block";
  el("rTitle").textContent="时间到！";
  el("rScore").textContent=Q.score;
  var pct=Q.answered?Q.correct/Q.answered:0;
  el("rStats").innerHTML=
    '<span class="statchip">答题 <b>'+Q.answered+'</b></span>'+
    '<span class="statchip">正确率 <b>'+Math.round(pct*100)+'%</b></span>';
  el("rGrade").textContent=gradeOf(pct,"quiz");
  fillWrongList(Q.wrong);
  setBest("tb8_best_quiz",Q.score);refreshBest();
}

/* 记录拼写模式最高连击 */
(function(){
  var orig=spellAnswer;
  spellAnswer=function(skipped){
    var before=S.streak;
    orig(skipped);
    if(S.streak>S.bestStreak)S.bestStreak=S.streak;
    if(S.streak===0&&before>(S.bestStreak||0))S.bestStreak=before;
  };
})();
S.bestStreak=0;

el("rRetry").onclick=function(){el("result").style.display="none";el("home").style.display="block"};
el("rReview").onclick=function(){
  var w=loadWrong();var keys=Object.keys(w);
  if(!keys.length){alert("错词本是空的！");return}
  startSpell(keys.map(function(k){return [k,w[k].ph,w[k].m,w[k].t]}),true);
};
el("rHome").onclick=function(){clearInterval(Q.timer||null);el("result").style.display="none";el("game").style.display="none";el("home").style.display="block"};

refreshWrongCount();refreshBest();
</script>
